name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: skdevelopers/set-php@v1.0.2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, tokenizer, bcmath, curl, fileinfo, pdo_sqlite, sqlite3, pdo, zip
          ini-values: |
            memory_limit=2G
            post_max_size=100M
            upload_max_filesize=100M

      - name: Install Required PHP Extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-ctype php8.3-tokenizer php8.3-bcmath php8.3-curl php8.3-fileinfo php8.3-pdo php8.3-zip

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run Migrations (Optional)
        run: php artisan migrate --no-interaction --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run Laravel Tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
